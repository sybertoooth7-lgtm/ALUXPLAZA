services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      # This file publishes port 3001 directly, with no reverse proxy in front
      # of the app, so no forwarded hop may be trusted. The config default is 1
      # (correct for Render/Vercel); leaving it at 1 here would let a visitor
      # send their own X-Forwarded-For and forge the IP that rate limits, IP
      # blocks, login alerts and the Shield all key on. If you put a load
      # balancer or nginx in front, raise this to the real hop count and verify
      # it with GET /api/admin/diagnostics/client-ip.
      - TRUST_PROXY_HOPS=0
      - DATABASE_URL=postgresql://alux:${DB_PASSWORD}@postgres:5432/alux_plaza
      - DB_SSL=false
      - CORS_ORIGIN=${CORS_ORIGIN}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=8h
      - CONTACT_RATE_LIMIT_WINDOW_MINUTES=15
      - CONTACT_RATE_LIMIT_MAX=5
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL:-onboarding@resend.dev}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SENTRY_DSN=${SENTRY_DSN}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alux
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: alux_plaza
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alux -d alux_plaza']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
