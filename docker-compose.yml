services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # NOTE: a Redis service used to be here for rate limiting. It's removed —
  # the rate limiter now uses a Postgres-backed store (rate_limits table,
  # migration 005) instead, since REDIS_URL was never actually set anywhere
  # in practice and the rate limiter was silently falling back to a
  # non-cluster-safe in-memory store the whole time. One less service to
  # run, patch, and pay for.

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env — no default, so a real deployment can't accidentally run with a known password}@postgres:5432/${POSTGRES_DB:-appdb}
      # No fallback default — config.js already refuses to boot in
      # production without a real JWT_SECRET, but the old default here
      # ("dev-secret-change-in-production") meant anyone who forgot to
      # override it in .env got a publicly-known secret instead of a
      # clear failure. Failing loud here is safer than failing loud only
      # sometimes, deep inside the app.
      #
      # Generate one with:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      #
      # NOTE: the :? message below must stay free of quotes and
      # colon-space sequences — an earlier version read "generate one
      # with: node -e ..." inside this unquoted scalar and the ": " made
      # the whole file invalid YAML, breaking every docker compose
      # command including plain config validation.
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET must be set in .env — generate one using the node command in the comment above}'
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # CORS_ORIGIN, not FRONTEND_URL — matches what config.js/index.js
      # actually read. The old FRONTEND_URL var here was silently ignored.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      CLUSTER_MODE: ${CLUSTER_MODE:-false}
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app:ro
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      # /health, not /api/health — the old path here 404'd against every
      # real deployment of this backend, so Docker would eventually mark a
      # perfectly healthy container as unhealthy and restart it.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend (optional — serves static build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
