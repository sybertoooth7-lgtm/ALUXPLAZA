name: Security invariants

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Runs without Node or a database, so it gates a PR quickly and cannot
      # be defeated by a missing service container.
      - name: Verify security hardening invariants
        run: python3 scripts/verify-security-hardening.py
