name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    # Every curl in both boot steps below targets :3001, matching
    # config.js's default — pinned explicitly at job level so it's not
    # silently dependent on that default staying put.
    env:
      PORT: '3001'
    defaults:
      run:
        working-directory: backend

    # .env.example's DATABASE_URL points at alux:password@localhost:5432/alux_plaza —
    # this service must match those exact credentials or the server can't boot.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alux
          POSTGRES_PASSWORD: password
          POSTGRES_DB: alux_plaza
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Boot the server and smoke-test the API
        run: |
          cp .env.example .env
          # .env.example ships NODE_ENV=production as a reminder for real
          # deploys — left as-is here, cookies go Secure-only and curl never
          # sends them back over plain http://localhost, silently breaking
          # the CSRF-cookie contact-form step below.
          sed -i "s/NODE_ENV=production/NODE_ENV=development/" .env
          # NOTE: this must match the literal placeholder text currently in
          # .env.example. If that file's placeholder ever changes, update
          # this sed pattern too, or the JWT_SECRET silently never gets
          # replaced and the server refuses to boot (weak-secret check).
          sed -i "s/your-64-char-random-secret-here-change-me/$(node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")/" .env

          node src/index.js &
          SERVER_PID=$!

          # Flaked before on a hard-coded `sleep 2` (failed once, passed on
          # rerun) — poll /api/health instead of guessing a fixed delay.
          echo "Waiting for server to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Server is up after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to become healthy after 30 attempts"
              exit 1
            fi
            sleep 0.5
          done

          # Was: curl -sf http://localhost:3001/api/health/deep
          # 5696b87 removed the /health/deep route when it replaced it with the
          # cached /health, but this step was never updated — so it has been
          # curling a 404 ever since, and `curl -f` turns 404 into exit 22.
          # That is why this job has never once passed (0 successes in 64 runs
          # back to 2026-08-30) while every other job was green.
          #
          # Asserting on /api/health preserves the original intent (prove the
          # server can actually reach Postgres, not just that the port is open)
          # because that route returns 503 when the DB is down. Deliberately
          # NOT reintroducing a cache-bypassing /deep endpoint: the 5s cache on
          # /health exists to stop unauthenticated polling from exhausting the
          # connection pool, and this smoke test should not reopen that.
          echo "Checking /api/health (asserts db:up)..."
          HEALTH=$(curl -sS -f http://localhost:3001/api/health) || {
            echo "GET /api/health failed:"; curl -sS -i http://localhost:3001/api/health; exit 1;
          }
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"db":"up"' || {
            echo "Expected db:up from /api/health, got: $HEALTH"; exit 1;
          }

          # Every curl below uses -sS (capital S) so transport-level errors are
          # printed instead of silently swallowed. Plain -sf discarded the
          # response body on failure, which is why a month of 404s produced no
          # usable diagnosis.
          echo "Checking /api/status/defense-matrix..."
          curl -sS -f http://localhost:3001/api/status/defense-matrix

          # CSRF is enforced globally on all non-GET requests — a bare curl
          # POST with no prior GET (to receive the csrfToken cookie) and no
          # x-csrf-token header gets rejected with 403, not a real response.
          echo "Seeding CSRF cookie..."
          curl -sS -f -c cookies.txt http://localhost:3001/api/health > /dev/null
          CSRF=$(grep csrfToken cookies.txt | awk '{print $7}')
          if [ -z "$CSRF" ]; then
            echo "No csrfToken cookie was set — cannot exercise the CSRF-guarded POST"
            cat cookies.txt; exit 1
          fi

          echo "Submitting a test contact form entry..."
          curl -sS -f -b cookies.txt -X POST http://localhost:3001/api/contact \
            -H "Content-Type: application/json" \
            -H "x-csrf-token: $CSRF" \
            -d '{"name":"CI Test","email":"ci@example.com","message":"automated smoke test"}'

          kill $SERVER_PID

      - name: Verify honeypot field silently no-ops bot-shaped submissions
        run: |
          # NOTE: the honeypot field is named `honeypot` in the actual API
          # (not `website`), and a submission that fills it in intentionally
          # gets a 200 + fake "success" response, not a 400 — the whole
          # point of a honeypot is to not tip off the bot that it was
          # caught. Asserting 400 here would make this test pass for the
          # wrong reason (missing required `name` field) while never
          # actually exercising the honeypot branch at all.
          node src/index.js &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Server is up after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to become healthy after 30 attempts"
              exit 1
            fi
            sleep 0.5
          done

          curl -sS -f -c cookies.txt http://localhost:3001/api/health > /dev/null
          CSRF=$(grep csrfToken cookies.txt | awk '{print $7}')
          if [ -z "$CSRF" ]; then
            echo "No csrfToken cookie was set — cannot exercise the CSRF-guarded POST"
            cat cookies.txt; exit 1
          fi

          RESPONSE=$(curl -sS -f -b cookies.txt -X POST http://localhost:3001/api/contact \
            -H "Content-Type: application/json" \
            -H "x-csrf-token: $CSRF" \
            -d '{"name":"Bot","email":"bot@spam.com","message":"spam message","honeypot":"filled-by-bot"}') || {
              echo "Honeypot POST failed:"; curl -sS -i -b cookies.txt -X POST http://localhost:3001/api/contact \
                -H "Content-Type: application/json" \
                -H "x-csrf-token: $CSRF" \
                -d '{"name":"Bot","email":"bot@spam.com","message":"spam message","honeypot":"filled-by-bot"}'; exit 1;
            }
          kill $SERVER_PID
          if ! echo "$RESPONSE" | grep -q '"success":true'; then
            echo "Expected honeypot submission to get a fake-success response, got: $RESPONSE"
            exit 1
          fi
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "Honeypot submission was actually saved to the database (should be a no-op): $RESPONSE"
            exit 1
          fi
          echo "Honeypot correctly short-circuited with a no-op fake-success response"
