name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Root has no committed package-lock.json (only backend/ and frontend/ do),
      # so npm ci has nothing to read here and npm install is the correct call.
      - run: npm install
      - run: npm run format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cd frontend && npm ci && npm run lint
      - run: cd backend && npm ci && npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cd frontend && npm ci && npx tsc --noEmit

  test-backend:
    runs-on: ubuntu-latest
    # test/setup.js reads TEST_DATABASE_URL, not DATABASE_URL, and it reads
    # that before anything imports dotenv — so it has to be a real env var,
    # not a line in .env. The password must match POSTGRES_PASSWORD below;
    # setup.js's own fallback uses a different one, which is what silently
    # failed this job with 28P01 auth_failed until it was set here.
    env:
      TEST_DATABASE_URL: postgresql://alux:password@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alux
          POSTGRES_PASSWORD: password
          POSTGRES_DB: alux_plaza
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cd backend && npm ci
      - run: cd backend && cp .env.example .env
      - run: cd backend && sed -i 's/NODE_ENV=.*/NODE_ENV=development/' .env
      - run: cd backend && npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false # a Codecov hiccup shouldn't fail the whole CI run
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cd frontend && npm ci && npm audit --audit-level=high
      - run: cd backend && npm ci && npm audit --audit-level=high
