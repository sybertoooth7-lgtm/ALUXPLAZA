server {
    listen 80;
    server_name localhost;
    # Don't advertise the nginx version in the Server header — the few bytes
    # saved are not the point, the version number handed to scanners is.
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The backend sends its own via Helmet, but that only
    # covers /api/* responses proxied through here — everything nginx serves
    # directly (the static frontend build) needs these.
    include /etc/nginx/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Vite emits content-hashed bundles, so these never change for a given URL.
    # add_header at this level would otherwise drop the inherited security
    # headers, hence the include.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # The app shell, including the SPA fallback below, must be revalidated so a
    # new deploy is picked up on the next navigation.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
